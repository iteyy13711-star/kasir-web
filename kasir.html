<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Simple</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap');
        .font-produk { font-family: 'Playfair Display', serif; letter-spacing: 0.5px; }
        
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-toast { animation: slideDown 0.3s ease-out forwards; }
        
        @keyframes slideUpModal {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-modal { animation: slideUpModal 0.3s ease-out forwards; }
        
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#2E008B] via-[#4A55A2] to-[#2E008B] min-h-screen text-slate-800">

    <div class="w-full max-w-7xl mx-auto min-h-screen relative pb-24 shadow-2xl bg-black/10">
        
        <!-- Area Pencarian -->
        <div id="header-area" class="p-4 sticky top-0 z-10 bg-gradient-to-b from-[#2E008B] to-transparent pt-6 pb-4">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input id="searchInput" type="text" placeholder="Cari produk..." 
                    class="w-full pl-12 pr-4 py-3 rounded-xl border-none outline-none focus:ring-2 focus:ring-indigo-400 bg-white shadow-lg text-slate-700">
            </div>
        </div>

        <!-- Area Konten -->
        <div id="main-content" class="p-4">
            
            <!-- VIEW: KASIR -->
            <div id="view-kasir">
                <div id="productList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3"></div>
            </div>

            <!-- VIEW: INVENTARIS -->
            <div id="view-inventaris" class="hidden">
                
                <!-- Form Tambah/Edit Produk -->
                <div id="formContainer" class="bg-white rounded-xl p-4 shadow-lg mb-4 transition-colors duration-300">
                    <h3 id="formTitle" class="font-bold text-lg mb-3 text-indigo-900">Tambah Produk Baru</h3>
                    <form id="formProduct" class="space-y-3">
                        <input type="hidden" id="editId">
                        
                        <div>
                            <label class="text-xs font-semibold text-slate-500 mb-1 block">Nama Produk</label>
                            <input type="text" id="inpNama" placeholder="Contoh: KOPI SUSU" required class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none uppercase">
                        </div>
                        
                        <div class="flex gap-2">
                            <div class="flex-1">
                                <label class="text-xs font-semibold text-slate-500 mb-1 block">Harga Jual (Rp)</label>
                                <!-- Menggunakan type="text" agar bebas dari validasi bawaan browser yang rewel -->
                                <input type="text" inputmode="numeric" id="inpHarga" placeholder="15000" required class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
                            </div>
                            <div class="w-24">
                                <label class="text-xs font-semibold text-slate-500 mb-1 block">Stok</label>
                                <input type="text" inputmode="numeric" id="inpStok" placeholder="0" required class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
                            </div>
                        </div>
                        
                        <div class="flex gap-2 pt-2">
                            <button type="submit" id="btnSubmit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-bold transition shadow-md">Simpan Produk</button>
                            <button type="button" id="btnCancelEdit" onclick="cancelEdit()" class="hidden w-24 bg-rose-500 hover:bg-rose-600 text-white py-2.5 rounded-lg font-bold transition shadow-md">Batal</button>
                        </div>
                    </form>
                </div>
                
                <!-- List Produk untuk Edit/Hapus -->
                <div id="inventoryList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3"></div>
            </div>

            <!-- VIEW: LAPORAN -->
            <div id="view-laporan" class="hidden space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="bg-white rounded-xl p-5 shadow-lg text-center">
                        <p class="text-slate-500 text-sm">Total Omset Hari Ini</p>
                        <h2 id="laporanOmset" class="text-3xl font-bold text-indigo-600 mt-2">Rp 0</h2>
                    </div>
                    <div class="bg-white rounded-xl p-5 shadow-lg text-center">
                        <p class="text-slate-500 text-sm">Jumlah Transaksi Hari Ini</p>
                        <h2 id="laporanTrx" class="text-3xl font-bold text-emerald-600 mt-2">0</h2>
                    </div>
                </div>
                <h3 class="font-bold text-white text-lg">Penjualan Per Hari</h3>
                <div id="laporanPerHari" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
            </div>

        </div>

        <!-- Tombol Keranjang -->
        <div id="floatingCart" class="fixed bottom-24 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-3xl z-20 hidden">
            <button onclick="openCartModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-2xl shadow-xl flex justify-between items-center transition border border-indigo-400">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="font-bold">Keranjang</span>
                    <span id="cartBadge" class="bg-white text-indigo-600 text-xs px-2 py-1 rounded-full font-bold">0</span>
                </div>
                <span id="cartTotalFloat" class="font-bold text-lg">Rp 0</span>
            </button>
        </div>

        <!-- Navigasi Bawah -->
        <nav class="fixed bottom-0 inset-x-0 max-w-7xl mx-auto bg-[#1A0B4A] border-t border-indigo-900 flex justify-around py-3 text-slate-400 z-30 pb-safe">
            <button onclick="setView('kasir')" class="nav-btn flex flex-col items-center gap-1 w-16 text-indigo-400 transition">
                <i class="fa-solid fa-cart-shopping text-xl"></i>
                <span class="text-[10px]">Kasir</span>
            </button>
            <button onclick="setView('inventaris')" class="nav-btn flex flex-col items-center gap-1 w-16 hover:text-white transition">
                <i class="fa-solid fa-box-open text-xl"></i>
                <span class="text-[10px]">Stok</span>
            </button>
            <button onclick="setView('laporan')" class="nav-btn flex flex-col items-center gap-1 w-16 hover:text-white transition">
                <i class="fa-solid fa-chart-simple text-xl"></i>
                <span class="text-[10px]">Laporan</span>
            </button>
        </nav>
    </div>

    <!-- Modal Keranjang -->
    <div id="cartModal" class="fixed inset-0 bg-black/60 z-40 hidden flex items-end justify-center backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl sm:max-h-[85vh] sm:mb-4 sm:rounded-3xl rounded-t-3xl p-5 shadow-2xl animate-modal">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-xl text-slate-800">Keranjang Belanja</h3>
                <button onclick="closeCartModal()" class="text-slate-400 hover:text-slate-700 bg-slate-100 rounded-full h-8 w-8"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="cartItems" class="max-h-[40vh] overflow-y-auto space-y-3 mb-4"></div>
            <div class="border-t pt-4">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>Total</span>
                    <span id="cartTotalModal" class="text-indigo-600">Rp 0</span>
                </div>
                <button onclick="checkout()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-lg transition shadow-lg shadow-indigo-600/30">
                    Bayar Sekarang
                </button>
            </div>
        </div>
    </div>

    <!-- Area Jendela Mengambang (Toast) -->
    <div id="toastContainer" class="fixed top-4 inset-x-0 mx-auto max-w-md px-4 z-50 flex flex-col items-center pointer-events-none space-y-2"></div>

    <script>
        // ==========================================
        // 1. KONFIGURASI FIREBASE (ANTI-CRASH)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCQ9Dc_MxE4McfD7-eOb4v37Oy3h4E0zaI",
            authDomain: "sistem-kasir-perdana.firebaseapp.com",
            databaseURL: "https://sistem-kasir-perdana-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sistem-kasir-perdana",
            storageBucket: "sistem-kasir-perdana.firebasestorage.app",
            messagingSenderId: "523396843008",
            appId: "1:523396843008:web:45bd60540413d099e3fae5"
        };

        let db = null;
        let useFirebase = false;

        // Menggunakan Try-Catch agar jika config salah, tidak merusak seluruh aplikasi
        try {
            if (firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey !== "GANTI_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                useFirebase = true;
                console.log("Sistem: Firebase Aktif.");
            } else {
                console.log("Sistem: Menggunakan LocalStorage (Firebase belum disetting).");
            }
        } catch (e) {
            console.warn("Firebase gagal dimuat, beralih ke LocalStorage.");
        }

        // ==========================================
        // 2. STATE & UTILITAS
        // ==========================================
        let products = [];
        let cart = []; 
        let transactions = [];

        const escapeHtml = (value) => String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

        const rp = (num) => {
            const n = Number(num);
            if (isNaN(n)) return "Rp 0";
            return "Rp " + n.toLocaleString('id-ID');
        };
        
        const dummyProducts = [
            { id: 'P1', nama: 'KOPI SUSU', harga: 15000, stok: 10 },
            { id: 'P2', nama: 'ROTI BAKAR', harga: 12000, stok: 5 },
            { id: 'P3', nama: 'ES TEH MANIS', harga: 5000, stok: 20 }
        ];

        // ==========================================
        // 3. INISIALISASI DATA
        // ==========================================
        function init() {
            if (useFirebase && db) {
                db.ref('pos_data').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && data.products) {
                        products = Array.isArray(data.products) ? data.products : Object.values(data.products);
                        transactions = Array.isArray(data.transactions)
                            ? data.transactions
                            : (data.transactions ? Object.values(data.transactions) : []);
                    } else {
                        products = dummyProducts;
                        transactions = [];
                        saveData(); 
                    }
                    renderAll();
                }, (error) => {
                    console.error("Firebase Error:", error);
                    loadFromLocal();
                });
            } else {
                loadFromLocal();
            }
        }

        function loadFromLocal() {
            try {
                const localData = localStorage.getItem('pos_data');
                if (localData) {
                    const parsed = JSON.parse(localData);
                    products = parsed.products || dummyProducts;
                    transactions = parsed.transactions || [];
                } else {
                    products = dummyProducts;
                    transactions = [];
                }
            } catch(e) {
                products = dummyProducts;
            }
            renderAll();
        }

        function saveData() {
            // 1. Simpan ke LocalStorage (Selalu jalan sebagai backup)
            try {
                localStorage.setItem('pos_data', JSON.stringify({ products, transactions }));
            } catch(e) {
                console.error("Gagal simpan LocalStorage:", e);
            }

            // 2. Simpan ke Firebase (Jika aktif)
            if (useFirebase && db) {
                db.ref('pos_data').set({ products, transactions }).catch(err => {
                    console.error("Gagal simpan Firebase:", err);
                    showToast('Gagal sinkron ke Cloud, data tersimpan di HP', 'bg-amber-500');
                });
            }
        }

        // ==========================================
        // 4. FUNGSI RENDER
        // ==========================================
        function renderAll() {
            renderProducts();
            renderInventory();
            renderCart();
            renderLaporan();
        }

        function renderProducts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('productList');
            
            const filtered = products.filter(p => p.nama.toLowerCase().includes(search));
            
            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-white text-center mt-10 opacity-70">Produk tidak ditemukan.</p>`;
                return;
            }

            container.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-2xl p-4 flex justify-between items-center shadow-lg animate-toast">
                    <div>
                        <h3 class="font-produk font-bold text-lg text-slate-800">${escapeHtml(p.nama)}</h3>
                        <p class="text-indigo-600 font-bold text-sm mt-1">${rp(p.harga)}</p>
                        <p class="text-xs text-slate-500 mt-1">Stok tersisa: <span class="${p.stok <= 3 ? 'text-red-500 font-bold' : 'font-semibold'}">${p.stok}</span></p>
                    </div>
                    <button onclick="addToCart('${escapeHtml(p.id)}')" ${p.stok <= 0 ? 'disabled' : ''} 
                        class="h-12 w-12 rounded-full ${p.stok <= 0 ? 'bg-slate-300' : 'bg-indigo-600 hover:bg-indigo-700 shadow-md shadow-indigo-600/30'} text-white flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-plus text-lg"></i>
                    </button>
                </div>
            `).join('');
        }

        function renderInventory() {
            const container = document.getElementById('inventoryList');
            container.innerHTML = products.map(p => `
                <div class="bg-white rounded-xl p-3 flex justify-between items-center shadow-md">
                    <div class="flex-1">
                        <p class="font-bold text-slate-800 text-sm">${escapeHtml(p.nama)}</p>
                        <div class="flex items-center gap-3 mt-1">
                            <span class="text-xs text-indigo-600 font-bold">${rp(p.harga)}</span>
                            <span class="text-xs text-slate-500 border-l border-slate-300 pl-3">Stok: <b>${p.stok}</b></span>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editProduct('${escapeHtml(p.id)}')" class="text-amber-600 hover:text-amber-700 bg-amber-100 p-2.5 rounded-lg font-bold text-sm" title="Edit Produk"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteProduct('${escapeHtml(p.id)}')" class="text-red-600 hover:text-red-700 bg-red-100 p-2.5 rounded-lg font-bold text-sm" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function renderLaporan() {
            const today = new Date();
            const todayKey = today.toLocaleDateString('en-CA');
            const validTransactions = transactions.filter(t => t && t.date && !isNaN(new Date(t.date).getTime()));

            const todayTransactions = validTransactions.filter(t =>
                new Date(t.date).toLocaleDateString('en-CA') === todayKey
            );
            const totalOmset = todayTransactions.reduce((sum, t) => sum + Number(t.total || 0), 0);
            document.getElementById('laporanOmset').innerText = rp(totalOmset);
            document.getElementById('laporanTrx').innerText = todayTransactions.length;

            const grouped = {};
            validTransactions.forEach(t => {
                const date = new Date(t.date);
                const dateKey = date.toLocaleDateString('en-CA');
                if (!grouped[dateKey]) grouped[dateKey] = { total: 0, count: 0 };
                grouped[dateKey].total += Number(t.total || 0);
                grouped[dateKey].count++;
            });

            const container = document.getElementById('laporanPerHari');
            const dateKeys = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

            if (dateKeys.length === 0) {
                container.innerHTML = '<p class="text-white text-center opacity-70 sm:col-span-2 lg:col-span-3 py-6">Belum ada penjualan.</p>';
                return;
            }

            container.innerHTML = dateKeys.map(dateKey => {
                const group = grouped[dateKey];
                const [year, month, day] = dateKey.split('-').map(Number);
                const label = new Date(year, month - 1, day).toLocaleDateString('id-ID', {
                    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
                });

                return `
                    <div class="bg-white rounded-xl p-4 shadow-lg border-l-4 border-indigo-500">
                        <p class="font-bold text-slate-800">${label}</p>
                        <div class="mt-3 flex justify-between items-end gap-3">
                            <div>
                                <p class="text-xs text-slate-500">Jumlah transaksi</p>
                                <p class="font-bold text-emerald-600">${group.count}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-xs text-slate-500">Total penjualan</p>
                                <p class="font-bold text-indigo-600 text-lg">${rp(group.total)}</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            const floatCart = document.getElementById('floatingCart');
            const badge = document.getElementById('cartBadge');
            
            let total = 0;
            let totalQty = 0;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-6">Keranjang masih kosong</p>`;
                floatCart.classList.add('hidden');
            } else {
                floatCart.classList.remove('hidden');
                
                container.innerHTML = cart.map(item => {
                    const p = products.find(x => x.id === item.id);
                    if(!p) return '';
                    const subtotal = p.harga * item.qty;
                    total += subtotal;
                    totalQty += item.qty;
                    
                    return `
                        <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <div>
                                <p class="font-bold text-slate-800 text-sm">${escapeHtml(p.nama)}</p>
                                <p class="text-xs text-slate-500">${rp(p.harga)} x ${item.qty}</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-indigo-600 text-sm">${rp(subtotal)}</span>
                                <button onclick="removeFromCart('${escapeHtml(p.id)}')" class="text-red-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            badge.innerText = totalQty;
            document.getElementById('cartTotalFloat').innerText = rp(total);
            document.getElementById('cartTotalModal').innerText = rp(total);
        }

        // ==========================================
        // 5. LOGIKA UTAMA
        // ==========================================
        function addToCart(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            
            if (p.stok <= 0) {
                showToast(`Stok ${escapeHtml(p.nama)} habis!`, 'bg-red-500');
                return;
            }

            const cartItem = cart.find(x => x.id === id);
            let currentQtyInCart = cartItem ? cartItem.qty : 0;

            if (currentQtyInCart >= p.stok) {
                showToast(`Stok ${escapeHtml(p.nama)} tidak mencukupi!`, 'bg-amber-500');
                return;
            }

            if (cartItem) {
                cartItem.qty++;
            } else {
                cart.push({ id, qty: 1 });
            }

            renderCart();
            showToast(`<b>${escapeHtml(p.nama)}</b> ditambahkan!<br><span class="text-xs opacity-90">Jumlah di keranjang: ${currentQtyInCart + 1}</span>`);
        }

        function removeFromCart(id) {
            const cartItem = cart.find(x => x.id === id);
            if (cartItem) {
                cartItem.qty--;
                if (cartItem.qty <= 0) {
                    cart = cart.filter(x => x.id !== id);
                }
            }
            renderCart();
        }

        function showToast(message, bgColor = 'bg-indigo-600') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            
            const toast = document.createElement('div');
            toast.className = `${bgColor} text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium animate-toast pointer-events-auto flex items-center gap-3 w-full max-w-xs border border-white/20`;
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-lg"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function openCartModal() { document.getElementById('cartModal').classList.remove('hidden'); }
        function closeCartModal() { document.getElementById('cartModal').classList.add('hidden'); }

        function checkout() {
            if (cart.length === 0) return;
            
            let total = 0;
            cart.forEach(item => {
                const p = products.find(x => x.id === item.id);
                if (p) {
                    total += p.harga * item.qty;
                    p.stok -= item.qty;
                }
            });

            transactions.unshift({ date: new Date().toISOString(), total });
            cart = [];
            saveData();
            renderAll();
            closeCartModal();
            showToast('Transaksi Berhasil!', 'bg-emerald-500');
        }

        // ==========================================
        // 6. NAVIGASI & MANAJEMEN PRODUK
        // ==========================================
        function setView(viewName) {
            ['kasir', 'inventaris', 'laporan'].forEach(v => {
                document.getElementById(`view-${v}`).classList.add('hidden');
            });
            document.getElementById(`view-${viewName}`).classList.remove('hidden');
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-indigo-400');
                btn.classList.add('text-slate-400');
            });
            
            const navs = document.querySelectorAll('.nav-btn');
            if(viewName === 'kasir') navs[0].classList.add('text-indigo-400');
            if(viewName === 'inventaris') navs[1].classList.add('text-indigo-400');
            if(viewName === 'laporan') navs[2].classList.add('text-indigo-400');
            
            if (viewName !== 'kasir') {
                document.getElementById('floatingCart').classList.add('hidden');
            } else {
                renderCart();
            }
        }

        // ---> FUNGSI SIMPAN PRODUK YANG SUDAH DIPERBAIKI TOTAL <---
        document.getElementById('formProduct').addEventListener('submit', (e) => {
            e.preventDefault();
            
            try {
                const editId = document.getElementById('editId').value;
                const nama = document.getElementById('inpNama').value.trim().toUpperCase();
                
                // Bersihkan format apapun, hanya ambil angka
                const hargaRaw = document.getElementById('inpHarga').value;
                const harga = parseInt(hargaRaw.replace(/[^0-9]/g, '')) || 0;
                
                const stokRaw = document.getElementById('inpStok').value;
                const stok = parseInt(stokRaw.replace(/[^0-9]/g, '')) || 0;

                if (!nama) {
                    showToast('Nama produk tidak boleh kosong!', 'bg-red-500');
                    return;
                }

                if (editId) {
                    // Mode Edit
                    const p = products.find(x => x.id === editId);
                    if (p) { 
                        p.nama = nama; 
                        p.harga = harga; 
                        p.stok = stok; 
                    }
                    showToast('Produk berhasil diperbarui', 'bg-emerald-500');
                } else {
                    // Mode Tambah
                    const newId = 'P' + Date.now();
                    products.push({ id: newId, nama, harga, stok });
                    showToast('Produk baru berhasil ditambahkan', 'bg-emerald-500');
                }

                saveData();
                renderAll();
                cancelEdit(); // Reset form ke mode Tambah

            } catch (error) {
                console.error(error);
                showToast('Terjadi kesalahan sistem', 'bg-red-500');
            }
        });

        // Fungsi Masuk Mode Edit
        function editProduct(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            
            document.getElementById('editId').value = p.id;
            document.getElementById('inpNama').value = p.nama;
            document.getElementById('inpHarga').value = p.harga;
            document.getElementById('inpStok').value = p.stok;
            
            // Ubah Tampilan Form jadi Kuning (Tanda Mode Edit)
            const container = document.getElementById('formContainer');
            container.classList.add('bg-yellow-50');
            container.classList.replace('bg-white', 'bg-yellow-50');
            
            document.getElementById('formTitle').innerText = '⚠️ Mode Edit Aktif';
            document.getElementById('formTitle').classList.replace('text-indigo-900', 'text-amber-700');
            
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.innerText = 'Update Produk';
            btnSubmit.classList.replace('bg-indigo-600', 'bg-amber-500');
            btnSubmit.classList.replace('hover:bg-indigo-700', 'hover:bg-amber-600');
            
            document.getElementById('btnCancelEdit').classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Fungsi Batal Edit / Kembali ke Mode Tambah
        function cancelEdit() {
            document.getElementById('formProduct').reset();
            document.getElementById('editId').value = '';
            
            // Kembalikan Tampilan ke Semula
            const container = document.getElementById('formContainer');
            container.classList.remove('bg-yellow-50');
            container.classList.replace('bg-yellow-50', 'bg-white');
            
            const title = document.getElementById('formTitle');
            title.innerText = 'Tambah Produk Baru';
            title.classList.replace('text-amber-700', 'text-indigo-900');
            
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.innerText = 'Simpan Produk';
            btnSubmit.classList.replace('bg-amber-500', 'bg-indigo-600');
            btnSubmit.classList.replace('hover:bg-amber-600', 'hover:bg-indigo-700');
            
            document.getElementById('btnCancelEdit').classList.add('hidden');
        }

        function deleteProduct(id) {
            if (confirm('Yakin ingin menghapus produk ini?')) {
                products = products.filter(x => x.id !== id);
                saveData();
                renderAll();
                showToast('Produk berhasil dihapus', 'bg-red-500');
                cancelEdit(); // Reset form jika produk yang dihapus sedang diedit
            }
        }

        document.getElementById('searchInput').addEventListener('input', renderProducts);

        // Jalankan Aplikasi
        init();
    </script>
</body>
</html>
